layout: default
---

<article class="page" itemscope itemtype="https://schema.org/WebPage">

  <div class="page-content" itemprop="text">
    {{ content }}
  </div>

</article>

{%- comment -%}
  Styling lives in assets/main.css. It used to be an inline <style> block here,
  but because that block loaded after main.css its rules (e.g. .page-content h2)
  outranked the @media print rules, so printing/PDF ignored the print font sizes
  and spilled the CV over many pages.
{%- endcomment -%}
