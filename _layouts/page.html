---
layout: default
---

<article class="page" itemscope itemtype="https://schema.org/WebPage">

  <div class="page-content" itemprop="text">
    {{ content }}
  </div>

</article>

<style>
.page {
  max-width: 900px;
  margin: 2rem auto;
  padding: 0 1rem;
}

.page-header {
  margin-bottom: 2rem;
  border-bottom: 1px solid #e8e8e8;
  padding-bottom: 2rem;
}

.page-title {
  font-size: 2rem;
  line-height: 1.2;
  margin: 0 0 0.5rem 0;
  color: #333;
}

.page-subtitle {
  color: #666;
  font-size: 1.1rem;
  margin: 0;
  font-style: italic;
}

.page-content {
  line-height: 1.8;
  color: #333;
  font-size: 1rem;
}

.page-content h2 {
  margin-top: 2rem;
  margin-bottom: 1rem;
  font-size: 1.5rem;
  color: #2a7ae2;
  border-bottom: 2px solid #f0f0f0;
  padding-bottom: 0.5rem;
}

.page-content h3 {
  margin-top: 1.5rem;
  margin-bottom: 0.75rem;
  font-size: 1.2rem;
  color: #444;
}

.page-content code {
  background-color: #f4f4f4;
  padding: 0.2rem 0.4rem;
  border-radius: 0.25rem;
  font-family: 'Courier New', monospace;
  font-size: 0.9rem;
}

.page-content pre {
  background-color: #f4f4f4;
  border-left: 4px solid #2a7ae2;
  padding: 1rem;
  border-radius: 0.25rem;
  overflow-x: auto;
  margin: 1rem 0;
}

.page-content pre code {
  background: none;
  padding: 0;
  border-radius: 0;
}

.page-content blockquote {
  border-left: 4px solid #2a7ae2;
  padding-left: 1rem;
  margin-left: 0;
  color: #666;
  font-style: italic;
}

.page-content ul,
.page-content ol {
  margin: 1rem 0;
  padding-left: 2rem;
}

.page-content li {
  margin-bottom: 0.5rem;
}

.page-content table {
  border-collapse: collapse;
  width: 100%;
  margin: 1rem 0;
}

.page-content table th,
.page-content table td {
  border: 1px solid #e8e8e8;
  padding: 0.75rem;
  text-align: left;
}

.page-content table th {
  background-color: #f4f4f4;
  font-weight: bold;
  color: #333;
}

.page-content table tr:nth-child(even) {
  background-color: #fafafa;
}

.btn {
  display: inline-block;
  padding: 0.75rem 1.5rem;
  margin: 0.5rem 0.5rem 0.5rem 0;
  border-radius: 0.25rem;
  text-decoration: none;
  font-weight: 500;
  transition: all 0.3s ease;
  border: 2px solid transparent;
}

.btn-primary {
  background-color: #2a7ae2;
  color: white;
}

.btn-primary:hover {
  background-color: #1e5fa3;
}

.btn-secondary {
  background-color: #e8e8e8;
  color: #333;
}

.btn-secondary:hover {
  background-color: #d0d0d0;
}

@media (max-width: 768px) {
  .page-title {
    font-size: 1.5rem;
  }

  .page-subtitle {
    font-size: 1rem;
  }
}
</style>
