image: /assets/PetyoKostakovProfile.jpg
twitter_username:
github_username: PetyoKostakov
linkedin_username: petyokostakov

# Build settings
# No gem-based theme: this site ships its own _layouts, _includes and
# assets/main.css. Pulling in minima only added a second, conflicting
# assets/main.css and a pile of Sass @import deprecation warnings.
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Collections for better organization
collections:
  learning:
    output: true
    permalink: /learning/:path/

# Exclude from processing
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - .DS_Store
  - .idea/

