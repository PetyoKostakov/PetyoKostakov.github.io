# Site configuration
title: Petyo Kostakov
email: petyokostakov@gmail.com
description: >-
  Professional portfolio showcasing CV, courses, and blog posts on software development,
  technology, and professional growth.
baseurl: ""
url: "https://petyokostakov.github.io"
twitter_username:
github_username: PetyoKostakov
linkedin_username: petyokostakov

# Build settings
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Collections for better organization
collections:
  courses:
    output: true
    permalink: /courses/:path/

# Exclude from processing
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - .DS_Store
  - .idea/

# Minima theme settings
minima:
  social_links:
    - { platform: github, user_url: "https://github.com/PetyoKostakov" }
    - { platform: linkedin, user_url: "https://www.linkedin.com/in/petyokostakov/" }
